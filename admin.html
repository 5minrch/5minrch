<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5min Rch - Live Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">

  <!-- 🔒 PIN Lock Screen -->
  <div id="pinBoxCard" class="w-full max-w-sm bg-slate-800 p-6 rounded-3xl shadow-2xl mt-12 text-center border border-slate-700">
    <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-emerald-500/20">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 class="text-xl font-bold tracking-tight mb-1 text-white">5min Rch Admin</h2>
    <p class="text-xs text-slate-400 mb-6">Enter 4-digit PIN to access orders</p>

    <div class="flex justify-center gap-3 mb-6" id="pinDotsContainer">
      <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 pin-dot"></div>
      <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 pin-dot"></div>
      <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 pin-dot"></div>
      <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 pin-dot"></div>
    </div>

    <!-- Numeric Keypad -->
    <div class="grid grid-cols-3 gap-2.5 max-w-[240px] mx-auto text-lg font-bold">
      <button onclick="enterPin('1')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">1</button>
      <button onclick="enterPin('2')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">2</button>
      <button onclick="enterPin('3')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">3</button>
      <button onclick="enterPin('4')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">4</button>
      <button onclick="enterPin('5')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">5</button>
      <button onclick="enterPin('6')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">6</button>
      <button onclick="enterPin('7')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">7</button>
      <button onclick="enterPin('8')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">8</button>
      <button onclick="enterPin('9')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">9</button>
      <button onclick="clearPin()" class="p-3 text-rose-400 rounded-xl hover:bg-rose-500/10 transition text-sm">C</button>
      <button onclick="enterPin('0')" class="p-3 bg-slate-700/60 hover:bg-slate-700 rounded-xl transition text-white">0</button>
      <button onclick="deletePin()" class="p-3 text-slate-400 rounded-xl hover:bg-slate-700/60 transition"><i class="fa-solid fa-delete-left"></i></button>
    </div>
  </div>

  <!-- 📊 Live Admin Desk (Hidden until PIN is correct) -->
  <div id="adminDesk" class="hidden w-full max-w-4xl space-y-4 my-6">
    <!-- Header -->
    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-black">
          5R
        </div>
        <div>
          <h1 class="text-lg font-black text-white">Live Orders & Management</h1>
          <p class="text-xs text-emerald-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            Firebase Connected (Live Auto-Sync)
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadOrders()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate"></i> Refresh
        </button>
        <button onclick="logoutAdmin()" class="px-3 py-1.5 bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 rounded-lg text-xs font-bold transition">
          Logout
        </button>
      </div>
    </div>

    <!-- Quick Controls -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Active UPI ID</label>
        <div class="flex gap-2">
          <input type="text" id="upiInput" class="flex-1 bg-slate-900 border border-slate-700 px-3 py-2 rounded-xl text-sm outline-none focus:border-emerald-500" value="rameshtelecom13@ybl">
          <button onclick="updateUpiCloud()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-xs font-bold transition">Update</button>
        </div>
      </div>

      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Store Status</p>
          <p id="storeStatusText" class="text-sm font-black text-emerald-400">Live (Accepting Orders)</p>
        </div>
        <button onclick="toggleMaintenance()" id="maintBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-bold transition">
          Toggle Maintenance
        </button>
      </div>
    </div>

    <!-- Orders Table -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl">
      <div class="p-4 border-b border-slate-700 flex items-center justify-between">
        <h3 class="font-bold text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-list-check text-emerald-400"></i> Recent Orders
        </h3>
        <span id="orderCountBadge" class="text-xs bg-slate-700 px-2 py-0.5 rounded-full text-slate-300">0 Orders</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900 text-slate-400 border-b border-slate-700 uppercase">
            <tr>
              <th class="p-3">Time</th>
              <th class="p-3">Mobile</th>
              <th class="p-3">Operator</th>
              <th class="p-3">MRP / Paid</th>
              <th class="p-3">Status</th>
              <th class="p-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y divide-slate-700">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-500">Loading live orders from Firebase...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 bg-emerald-600 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none"></div>

  <script>
    const ADMIN_PIN = "1222"; // Code se matched PIN
    const FIREBASE_DB_URL = "https://minrch-db-default-rtdb.firebaseio.com";
    let currentEnteredPin = "";

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `fixed bottom-6 ${isError ? 'bg-rose-600' : 'bg-emerald-600'} text-white text-xs px-4 py-2.5 rounded-xl shadow-lg transition-opacity duration-300 opacity-100`;
      setTimeout(() => t.classList.add('opacity-0'), 2500);
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((dot, idx) => {
        if (idx < currentEnteredPin.length) {
          dot.classList.add('bg-emerald-400', 'border-emerald-400');
        } else {
          dot.classList.remove('bg-emerald-400', 'border-emerald-400');
        }
      });
    }

    function enterPin(d) {
      if (currentEnteredPin.length < 4) {
        currentEnteredPin += d;
        updatePinDots();
        if (currentEnteredPin.length === 4) setTimeout(verifyPin, 150);
      }
    }

    function deletePin() {
      currentEnteredPin = currentEnteredPin.slice(0, -1);
      updatePinDots();
    }

    function clearPin() {
      currentEnteredPin = "";
      updatePinDots();
    }

    function verifyPin() {
      if (currentEnteredPin === ADMIN_PIN) {
        document.getElementById('pinBoxCard').classList.add('hidden');
        document.getElementById('adminDesk').classList.remove('hidden');
        showToast("Access Granted");
        loadOrders();
        setInterval(loadOrders, 10000); // Har 10 second me live auto-refresh
      } else {
        showToast("Galat PIN!", true);
        clearPin();
      }
    }

    function logoutAdmin() {
      clearPin();
      document.getElementById('adminDesk').classList.add('hidden');
      document.getElementById('pinBoxCard').classList.remove('hidden');
    }

    async function loadOrders() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/orders.json`);
        const data = await res.json();
        const tbody = document.getElementById('ordersTableBody');
        const badge = document.getElementById('orderCountBadge');

        if (!data) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Koi order abhi tak nahi aaya.</td></tr>`;
          badge.textContent = "0 Orders";
          return;
        }

        const entries = Object.entries(data).reverse();
        badge.textContent = `${entries.length} Orders`;
        tbody.innerHTML = "";

        entries.forEach(([id, order]) => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-700/40 transition";
          const statusBg = order.status === 'Completed' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300';
          
          tr.innerHTML = `
            <td class="p-3 text-slate-400 whitespace-nowrap">${order.time || 'Just now'}</td>
            <td class="p-3 font-mono font-bold text-white">${order.mobile || '---'}</td>
            <td class="p-3 uppercase text-slate-300 font-semibold">${order.operator || '---'}</td>
            <td class="p-3 font-semibold text-emerald-400">₹${order.payable || order.mrp || '---'}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${statusBg}">${order.status || 'Pending'}</span></td>
            <td class="p-3 text-right">
              <button onclick="markComplete('${id}')" class="px-2.5 py-1 bg-emerald-600/80 hover:bg-emerald-600 text-white rounded text-[11px] font-bold transition">
                Done
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error("Order load error", e);
      }
    }

    async function markComplete(id) {
      try {
        await fetch(`${FIREBASE_DB_URL}/orders/${id}/status.json`, {
          method: 'PUT',
          body: JSON.stringify('Completed')
        });
        showToast("Order marked as Completed");
        loadOrders();
      } catch (e) {
        showToast("Status update failed", true);
      }
    }

    async function updateUpiCloud() {
      const upi = document.getElementById('upiInput').value.trim();
      if (!upi) return;
      try {
        await fetch(`${FIREBASE_DB_URL}/settings/upi.json`, {
          method: 'PUT',
          body: JSON.stringify(upi)
        });
        showToast("Active UPI ID updated in Firebase!");
      } catch (e) {
        showToast("Update failed", true);
      }
    }

    async function toggleMaintenance() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/settings/maintenance.json`);
        const current = await res.json();
        const next = !current;
        await fetch(`${FIREBASE_DB_URL}/settings/maintenance.json`, {
          method: 'PUT',
          body: JSON.stringify(next)
        });
        document.getElementById('storeStatusText').textContent = next ? "Maintenance Mode ON" : "Live (Accepting Orders)";
        document.getElementById('storeStatusText').className = next ? "text-sm font-black text-rose-400" : "text-sm font-black text-emerald-400";
        showToast(next ? "Maintenance Activated" : "Site Live Again");
      } catch (e) {
        showToast("Failed to toggle mode", true);
      }
    }
  </script>
</body>
</html>
