<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Desk | 5min Rch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-4">

  <!-- PIN Protection Screen -->
  <div id="pinBoxCard" class="w-full max-w-sm bg-white p-6 rounded-2xl shadow-xl mt-16 text-center border border-slate-200">
    <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 class="text-xl font-bold mb-2">Admin Portal</h2>
    <p class="text-xs text-slate-500 mb-6">Enter 4-digit security PIN to access orders</p>

    <div class="flex justify-center gap-3 mb-6" id="pinDotsContainer">
      <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-300 pin-dot"></div>
      <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-300 pin-dot"></div>
      <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-300 pin-dot"></div>
      <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-300 pin-dot"></div>
    </div>

    <!-- Numeric Keypad -->
    <div class="grid grid-cols-3 gap-2 max-w-[240px] mx-auto text-lg font-bold">
      <button onclick="enterPin('1')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">1</button>
      <button onclick="enterPin('2')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">2</button>
      <button onclick="enterPin('3')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">3</button>
      <button onclick="enterPin('4')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">4</button>
      <button onclick="enterPin('5')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">5</button>
      <button onclick="enterPin('6')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">6</button>
      <button onclick="enterPin('7')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">7</button>
      <button onclick="enterPin('8')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">8</button>
      <button onclick="enterPin('9')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">9</button>
      <button onclick="clearPin()" class="p-3 text-rose-500 rounded-xl hover:bg-rose-50 transition text-sm">C</button>
      <button onclick="enterPin('0')" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">0</button>
      <button onclick="deletePin()" class="p-3 text-slate-500 rounded-xl hover:bg-slate-100 transition"><i class="fa-solid fa-delete-left"></i></button>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDesk" class="hidden w-full max-w-2xl bg-white p-6 rounded-2xl shadow-xl mt-6 border border-slate-200">
    <div class="flex items-center justify-between pb-4 border-b border-slate-200 mb-4">
      <div>
        <h1 class="text-xl font-black text-slate-800">Admin Control Center</h1>
        <p class="text-xs text-slate-500">Live Orders & Settings</p>
      </div>
      <button onclick="logoutAdmin()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg font-bold text-slate-600 transition">Logout</button>
    </div>

    <!-- Quick Actions -->
    <div class="space-y-4">
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <label class="block text-xs font-bold text-slate-600 mb-1">Set Active UPI ID</label>
        <div class="flex gap-2">
          <input type="text" id="settingUpiId" class="flex-1 px-3 py-2 text-sm border rounded-lg outline-none" placeholder="UPI ID daalein">
          <button onclick="saveAdminSettings()" class="bg-emerald-600 text-white px-4 py-2 text-sm font-bold rounded-lg hover:bg-emerald-700 transition">Save</button>
        </div>
      </div>

      <div>
        <h3 class="text-sm font-bold text-slate-700 mb-2">Live Storefront Link</h3>
        <div class="p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-xs flex items-center justify-between">
          <span><i class="fa-solid fa-circle-check mr-1.5"></i> Connected</span>
          <a href="https://5minrch.shop" target="_blank" class="font-bold underline">Open Storefront</a>
        </div>
      </div>
    </div>
  </div>

  <div id="adminToast" class="fixed bottom-6 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none"></div>

  <script>
    const ADMIN_PIN = "1234"; // Apna 4-digit PIN yahan set karein
    let currentEnteredPin = "";

    function showToast(msg) {
      const t = document.getElementById('adminToast');
      t.textContent = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 2500);
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((dot, idx) => {
        if (idx < currentEnteredPin.length) {
          dot.classList.add('bg-emerald-600', 'border-emerald-600');
        } else {
          dot.classList.remove('bg-emerald-600', 'border-emerald-600');
        }
      });
    }

    function enterPin(digit) {
      if (currentEnteredPin.length < 4) {
        currentEnteredPin += digit;
        updatePinDots();
        if (currentEnteredPin.length === 4) {
          setTimeout(verifyPin, 200);
        }
      }
    }

    function deletePin() {
      currentEnteredPin = currentEnteredPin.slice(0, -1);
      updatePinDots();
    }

    function clearPin() {
      currentEnteredPin = "";
      updatePinDots();
    }

    function verifyPin() {
      if (currentEnteredPin === ADMIN_PIN) {
        document.getElementById('pinBoxCard').classList.add('hidden');
        document.getElementById('adminDesk').classList.remove('hidden');
        showToast("Access Granted");
      } else {
        showToast("Galat PIN! Access Denied");
        clearPin();
      }
    }

    function logoutAdmin() {
      clearPin();
      document.getElementById('adminDesk').classList.add('hidden');
      document.getElementById('pinBoxCard').classList.remove('hidden');
    }

    function saveAdminSettings() {
      const upi = document.getElementById('settingUpiId').value.trim();
      if (upi) {
        localStorage.setItem('admin_custom_upi', upi);
        showToast("UPI ID saved successfully");
      }
    }
  </script>
</body>
</html>
