<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5minrch - Scheduled Maintenance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4 text-slate-800">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-xl text-center">
    <!-- Brand -->
    <div class="text-3xl font-black text-[#002970] mb-6">
      5min<span class="text-[#00BAF2]">rch</span>
      <span class="text-[10px] bg-sky-50 text-[#002970] border border-sky-200 font-extrabold px-1.5 py-0.5 rounded uppercase ml-1">Pay</span>
    </div>

    <!-- Maintenance Graphic / Icon -->
    <div class="w-20 h-20 bg-amber-50 border border-amber-200 text-amber-500 rounded-3xl flex items-center justify-center text-3xl mx-auto mb-6 shadow-sm">
      🛠️
    </div>

    <h1 class="text-2xl font-black text-[#002970] mb-2">Under Maintenance</h1>
    <p class="text-sm text-slate-500 font-medium leading-relaxed mb-6">
      Hum gateway security aur system upgrade par kaam kar rahe hain. Recharge services jaldi hi wapas live kar di jayengi.
    </p>

    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-xs font-semibold text-slate-600 mb-6 flex items-center justify-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
      <span>System Update in Progress</span>
    </div>

    <div class="text-[11px] text-slate-400 font-semibold">
      © 2026 5minrch. All rights reserved.
    </div>
  </div>

</body>
</html>
